# dsh-plugin-memory bundle patch: one host-plane row.
#
# The row's node half (lib/index.js) owns the cross-session memory store under
# ~/.dsh/memory, registers the `memory` settings namespace, the six global
# memory tools, the `agent/pre-step` injection, and the opt-in `turn/end`
# distillation (off by default; the conversation agent maintains memory itself).
# Host-plane (not an agent preset row) because a settings namespace registers
# once per process and the store is shared by every session.
#
# Its `dsh.client` declaration makes the clientModules scanner serve
# lib/client.js to the browser, which registers the settings card under
# `settings.plugin.item` keyed by the `memory` namespace.
- insert:
    - id: memory
      name: 'dsh-plugin-memory'
